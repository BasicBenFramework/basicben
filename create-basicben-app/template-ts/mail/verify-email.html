<!-- Inline styles only: mail clients discard <style> blocks and stylesheets. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">Confirm your email</h1>

  <p style="margin: 0 0 16px; line-height: 1.5;">
    Hi {{name}}, confirm your email address to finish setting up your {{siteName}} account.
  </p>

  <p style="margin: 0 0 24px;">
    <a href="{{verifyUrl}}"
       style="display: inline-block; background: #111; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 6px;">
      Confirm email
    </a>
  </p>

  <p style="margin: 0 0 8px; font-size: 13px; color: #666; line-height: 1.5;">
    Or paste this into your browser:<br>
    <span style="word-break: break-all;">{{verifyUrl}}</span>
  </p>

  <p style="margin: 16px 0 0; font-size: 13px; color: #666; line-height: 1.5;">
    This link expires in 24 hours. If you did not create an account, you can ignore
    this message — nothing will happen.
  </p>
</div>
