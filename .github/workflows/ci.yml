name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      # The tests read the framework's own source: hook coverage scans the
      # installed core for call sites, and the API reference generator imports
      # SCOPES from it. The import-extensions test parses src/ with the
      # TypeScript compiler, a dev dependency, so this installs everything.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # src/ compiled to lib/ the way the package will ship it (phase 4b). It
      # must keep compiling, with no type errors, before anything depends on it.
      - name: Compile lib/
        run: npm run build:lib

  smoke:
    runs-on: ubuntu-latest
    # A site with every feature, one without mysendbox, and the bare core.
    strategy:
      fail-fast: false
      matrix:
        features: ['', 'analytics,members,theme', 'none']
    name: smoke (${{ matrix.features || 'all features' }})
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      # npm pack compiles lib/ with the dev dependencies' tsc.
      - name: Install all dependencies
        run: npm ci

      - name: Pack the CMS, install it into site/, build and boot it
        run: ./scripts/smoke-test.sh
        env:
          SMOKE_FEATURES: ${{ matrix.features }}
