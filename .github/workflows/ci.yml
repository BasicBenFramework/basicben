name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Run tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [javascript, typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Scaffold, build and boot a real app
        run: |
          if [ "${{ matrix.template }}" = "typescript" ]; then
            ./scripts/smoke-test.sh --ts
          else
            ./scripts/smoke-test.sh
          fi
