name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # Unit tests pass on a package published without its templates and on a server
  # entry that cannot start. Both have shipped. The smoke test builds and boots a
  # real scaffolded app, and publishing is gated on it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'

      - name: Run tests
        run: npm test

      # The smoke test regenerates the committed declarations to check they
      # still match the JSDoc, which needs the framework's own tsc and React
      # types. Publishing stale types is silent otherwise.
      - name: Install dev dependencies
        run: npm ci

      - name: Scaffold, build and boot a real app
        run: ./scripts/smoke-test.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'

      # The scaffolder is the only package published from this repository; the
      # framework has its own. `prepack` copies the CMS into ./template-ts as
      # part of publishing, so the tarball is self-contained.
      - name: Install
        run: npm ci

      - name: Publish @basicbenframework/create
        working-directory: ./create
        run: npm publish --access public --provenance
