<!-- Inline styles only: mail clients discard <style> blocks and stylesheets. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">New reply to your comment</h1>

  <p style="margin: 0 0 16px; line-height: 1.5;">
    Hi {{name}}, {{replierName}} replied to your comment on <strong>{{postTitle}}</strong>:
  </p>

  <blockquote style="margin: 0 0 24px; padding: 12px 16px; border-left: 3px solid #ddd; color: #333; line-height: 1.5; white-space: pre-wrap;">{{content}}</blockquote>

  <p style="margin: 0 0 24px;">
    <a href="{{replyUrl}}"
       style="display: inline-block; background: #111; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 6px;">
      Read the conversation
    </a>
  </p>

  <p style="margin: 0 0 8px; font-size: 13px; color: #666; line-height: 1.5;">
    Or paste this into your browser:<br>
    <span style="word-break: break-all;">{{replyUrl}}</span>
  </p>

  <p style="margin: 16px 0 0; font-size: 13px; color: #666; line-height: 1.5;">
    You asked to be told about replies to this comment.
    <a href="{{unsubscribeUrl}}" style="color: #666;">Stop these emails</a> —
    no account needed.
  </p>
</div>
